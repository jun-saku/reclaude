<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>reclaude admin</title>
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <link rel="stylesheet" href="/assets/theme.css">
  <style>
    .wrap { max-width: 960px; margin: 0 auto; padding: 32px 16px 80px; }
    header h1 { margin: 0; font-size: 1.8rem; }
    header p { margin: 4px 0 24px; color: var(--muted); }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
    #search {
      flex: 1 1 220px;
      font: inherit;
      padding: 10px 14px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
    }
    .chip {
      font: inherit;
      font-size: 0.9rem;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
    }
    .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
    .card {
      padding: 16px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--surface);
    }
    .card:hover { border-color: var(--accent); }
    .card .type { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--accent); }
    .card h2 { font-size: 1.1rem; margin: 6px 0 4px; line-height: 1.3; }
    .card h2 a { color: inherit; text-decoration: none; }
    .card p { margin: 0; color: var(--muted); font-size: 0.9rem; }
    .card .path { font-family: var(--mono); font-size: 0.8rem; color: var(--muted); word-break: break-all; }
    .card .foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 12px; }
    .card time { font-size: 0.8rem; color: var(--muted); }
    .copy {
      font: inherit;
      font-size: 0.85rem;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--accent);
      background: transparent;
      color: var(--accent);
      cursor: pointer;
    }
    .empty { color: var(--muted); padding: 32px 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>reclaude</h1>
      <p>Every published page. Only people you send a link to will know it exists.</p>
    </header>
    <div class="controls">
      <input id="search" type="search" placeholder="Search" aria-label="Search files">
      <button class="chip" data-section="" aria-pressed="true">All</button>
      <button class="chip" data-section="docs" aria-pressed="false">Docs</button>
      <button class="chip" data-section="slides" aria-pressed="false">Slides</button>
      <button class="chip" data-section="pages" aria-pressed="false">Pages</button>
    </div>
    <main id="grid" class="grid"></main>
  </div>

  <script>
    const LABELS = { docs: "Doc", slides: "Slides", pages: "Page" };
    const grid = document.getElementById("grid");
    const search = document.getElementById("search");
    let files = [];
    let section = "";

    function esc(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
    }

    function render() {
      const q = search.value.trim().toLowerCase();
      const shown = files.filter((f) =>
        (!section || f.section === section) &&
        (!q || (f.title + " " + f.description + " " + f.path).toLowerCase().includes(q))
      );
      if (!shown.length) {
        grid.innerHTML = '<p class="empty">Nothing here yet.</p>';
        return;
      }
      grid.innerHTML = shown.map((f) => `
        <div class="card">
          <span class="type">${LABELS[f.section] || f.section}</span>
          <h2><a href="${esc(f.url)}" target="_blank" rel="noreferrer">${esc(f.title)}</a></h2>
          ${f.description ? `<p>${esc(f.description)}</p>` : ""}
          <span class="path">${esc(f.url)}</span>
          <div class="foot">
            <time datetime="${esc(f.updated)}">Updated ${new Date(f.updated).toLocaleDateString()}</time>
            <button class="copy" data-url="${esc(location.origin + f.url)}">Copy link</button>
          </div>
        </div>`).join("");
    }

    grid.addEventListener("click", async (e) => {
      const btn = e.target.closest(".copy");
      if (!btn) return;
      try {
        if (navigator.share && matchMedia("(pointer: coarse)").matches) {
          await navigator.share({ url: btn.dataset.url });
          return;
        }
        await navigator.clipboard.writeText(btn.dataset.url);
        btn.textContent = "Copied";
      } catch {
        prompt("Copy this link:", btn.dataset.url);
      }
      setTimeout(() => (btn.textContent = "Copy link"), 1500);
    });

    document.querySelectorAll(".chip").forEach((chip) => {
      chip.addEventListener("click", () => {
        section = chip.dataset.section;
        document.querySelectorAll(".chip").forEach((c) => c.setAttribute("aria-pressed", String(c === chip)));
        render();
      });
    });
    search.addEventListener("input", render);

    fetch("files.json", { cache: "no-store" })
      .then((r) => r.json())
      .then((data) => { files = data.files || []; render(); })
      .catch(() => { grid.innerHTML = '<p class="empty">Could not load files.json. Run node scripts/build.mjs.</p>'; });
  </script>
</body>
</html>
