<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f6f3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161618" media="(prefers-color-scheme: dark)">
  <title>Tanks</title>
  <meta name="description" content="Battle City-style co-op: defend your base from waves of enemy tanks, solo or with 1–3 friends online, and post your best wave to the Top 10.">
  <link rel="stylesheet" href="../shared/base.css">
  <link rel="stylesheet" href="../shared/kit.css">
  <style>
    :root { --arena-edge: #3a3a40; }
    @media (prefers-color-scheme: dark) { :root { --arena-edge: #4a4a52; } }
    .hud { display: flex; justify-content: space-between; gap: 8px; font-weight: 700; font-variant-numeric: tabular-nums; font-size: 0.95rem; }
    .hud span { white-space: nowrap; }
    #arena {
      display: block; width: min(100%, calc(100svh - 360px)); min-width: 240px; aspect-ratio: 1; align-self: center;
      border-radius: 6px; border: 3px solid var(--arena-edge); background: #111113; touch-action: none; image-rendering: pixelated;
    }
    .controls { display: flex; justify-content: space-between; align-items: center; gap: 16px; user-select: none; -webkit-user-select: none; touch-action: none; }
    .pad { position: relative; width: 150px; height: 150px; flex: none; touch-action: none; border-radius: 50%; background: var(--soft); }
    .pad i {
      position: absolute; width: 48px; height: 48px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line);
      display: grid; place-items: center; font-style: normal; font-size: 1.1rem; color: var(--muted); pointer-events: none;
    }
    .pad i.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
    .pad [data-d="0"] { left: 51px; top: 4px; }
    .pad [data-d="1"] { right: 4px; top: 51px; }
    .pad [data-d="2"] { left: 51px; bottom: 4px; }
    .pad [data-d="3"] { left: 4px; top: 51px; }
    .fire {
      width: 104px; height: 104px; border-radius: 50%; flex: none; font-size: 1.05rem; letter-spacing: 0.05em; touch-action: none;
      box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.18);
    }
    .fire.on { transform: scale(0.95); box-shadow: none; }
    #status:empty { display: none; }
  </style>
</head>
<body>
  <main>
    <a class="home-link" href="../games/" aria-label="All games">‹</a>
  </main>
  <script type="module">
    import { start } from "../shared/kit.js";
    import game from "./game.js";
    import * as sim from "./sim.js";

    // Tanks on the game kit: the kit runs the screens and the game (here for solo, on the game server online);
    // this page draws the battlefield, reads the pad and Fire button, and drives this player's own tank.
    const { U, N, CELL, TANK, BRICK, STEEL, WATER, TREES, BASE_X, BASE_Y, PLAYER_SPEED, SHELL_SPEED, DIRS } = sim;
    const KIND_COLOURS = ["#a9adb5", "#d9dce2", "#c08a5a", "#6f7484"];
    const ARMOUR_COLOURS = ["#6f7484", "#c75b5b", "#b9a04a", "#7f9d6a", "#6f7484"]; // by hits left
    // Online, everything but this player's own tank and shell is drawn a little in the past, between two server
    // updates, so it moves smoothly. How far depends on the network: updates come 10 times a second, but on a phone
    // some arrive late; drawing far enough back that the next one is (nearly) always in already avoids the freeze and
    // jump of running out of them. It grows quickly when updates come late, and shrinks slowly when they're on time.
    const DELAY_MIN = 110, DELAY_MAX = 350;
    const EXTRAPOLATE_MS = 150; // past the newest update, things carry on the way they were going for this long
    const SEND_MS = 66;      // own tank to the server about 15 times a second (while it changes)

    let canvas, ctx, ground, gctx, px = 1, groundKey = "", hudEl, controlsEl, hintEl;
    let me = null;           // own tank { x, y, d, alive, life, moving, round }
    let lastSent = { at: 0, key: "" }, lastFire = 0;
    let effects = [], seenBooms = new Set(), mapCache = { key: "", bricks: null };
    let heldDir = null, firing = false;
    let delay = DELAY_MIN;
    // Online, this player's shell flies here from the moment Fire is pressed (the server's copy, drawn in the past, is
    // hidden): { x, y, d, speed }, and the line it flew along, to hide the server's copy until that lands too.
    let myShell = null, myLine = null;
    const keysDown = [];

    // ---------- the world on screen ----------
    // How far back to draw others (see DELAY_MIN): late updates (beyond the quickest seen) plus the longest gap
    // between them, over the last second or so.
    function delayFor(snaps, clockOff) {
      if (snaps.length < 4) return DELAY_MIN;
      const late = snaps.map((x) => x.recv - x.at - clockOff).sort((p, q) => p - q);
      let gap = 0;
      for (let i = 1; i < snaps.length; i++) gap = Math.max(gap, snaps[i].at - snaps[i - 1].at);
      return Math.max(DELAY_MIN, Math.min(DELAY_MAX, late[Math.floor(late.length * 0.9)] + gap + 15));
    }

    // The battlefield at the moment to draw: online, `delay` ago (by the server's clock), between the two updates
    // either side of it (or carried on a little past the newest); this player's own tank is where this device has
    // driven it. Shells fly straight at a known speed, so they're drawn from their last known spot, stopping at walls.
    function worldOf(info, now) {
      const snaps = info.snaps;
      if (!snaps.length) return null;
      const t = now - info.clockOff - (info.mode === "online" ? delay : 0);
      let a = snaps.length > 1 ? snaps[snaps.length - 2] : snaps[0], b = snaps[snaps.length - 1];
      for (let i = snaps.length - 1; i > 0; i--) { if (snaps[i - 1].at <= t) { a = snaps[i - 1]; b = snaps[i]; break; } }
      const span = b.at - a.at;
      const k = span > 0 ? Math.max(0, Math.min(1 + EXTRAPOLATE_MS / span, (t - a.at) / span)) : 1;
      const mix = (p, q) => (Math.hypot(q[0] - p[0], q[1] - p[1]) > 16 ? q : [p[0] + (q[0] - p[0]) * k, p[1] + (q[1] - p[1]) * k]);
      const av = a.v, v = b.v;
      const ea = new Map(av.e.map((x) => [x[0], x]));
      const enemies = v.e.map((e) => {
        const p = ea.get(e[0]);
        const [x, y] = p ? mix([p[2], p[3]], [e[2], e[3]]) : [e[2], e[3]];
        return { id: e[0], kind: e[1], x, y, d: e[4], hp: e[5], flash: !!e[7] };
      });
      const tanks = Object.entries(v.tanks).map(([key, q]) => {
        const p = av.tanks[key];
        const [x, y] = p && p[6] === q[6] ? mix([p[0], p[1]], [q[0], q[1]]) : [q[0], q[1]];
        return { seat: Number(key), x, y, d: q[2], alive: !!q[3], shield: !!q[4], out: !!q[7] };
      });
      const own = tanks.find((x) => x.seat === info.me);
      if (own && me && me.alive) Object.assign(own, { x: me.x, y: me.y, d: me.d });
      if (mapCache.key !== v.b + v.w) mapCache = { key: v.b + v.w, bricks: sim.decBricks(v.b, v.w) };
      const world = { wave: v.w, lives: v.l, left: v.n, base: !!v.base, layout: sim.layoutFor(v.w), bricks: mapCache.bricks, tanks, enemies, shells: [],
        booms: v.bo.map((x) => ({ id: x[0], x: x[1], y: x[2], big: !!x[3] })), banner: v.banner, over: v.over };
      // Shells: from the newest update that has each one (newer ones also cover those that hit something just before),
      // flown on to time t, or back along their line if t is before that update. One that would hit something by t is gone.
      const seen = new Set(), targets = [...enemies, ...tanks.filter((x) => x.alive)];
      for (const snap of info.mode === "online" ? [b, a] : [b]) {
        for (const [id, x, y, d, speed, owner] of snap.v.s) {
          if (seen.has(id)) continue;
          seen.add(id);
          const dt = (t - snap.at) / 1000;
          const shell = { x, y, d, speed };
          if (dt < 0) {
            shell.x += DIRS[d][0] * speed * dt; shell.y += DIRS[d][1] * speed * dt;
            // Back along its line, a new shell may not have left its tank yet (a flying one never overlaps a tank).
            if (targets.some((q) => sim.overlap(shell.x - 1, shell.y - 1, 2, q.x, q.y, TANK))) continue;
          }
          else if (dt > 0 && sim.flyShell(world, shell, Math.min(dt, 0.4), targets)) continue;
          // This player's own shell is drawn by this device (myShell), so its copy here is left out (not enemies' on
          // the same line). A server without owners (an older one) sends none: then any shell on that line is.
          if (myLine && (owner === undefined || owner === info.me) && d === myLine.d && Math.abs((d % 2 ? shell.y : shell.x) - myLine.across) < 1.5) continue;
          world.shells.push(shell);
        }
      }
      if (myShell) world.shells.push(myShell);
      return world;
    }

    // Own tank: follow the game when it was hit, respawned, a new game started, or it didn't accept a move.
    function syncMe(info) {
      const snap = info.snaps[info.snaps.length - 1];
      const t = snap?.v.tanks[info.me];
      if (!t) return;
      const [x, y, d, alive, , , life] = t;
      if (!me || me.round !== snap.round || me.life !== life || !alive) me = { x, y, d, alive: !!alive, life, moving: false, round: snap.round };
      else if (Math.hypot(me.x - x, me.y - y) > 20) Object.assign(me, { x, y });
    }

    // ---------- every frame ----------
    function frame(info) {
      syncMe(info);
      if (info.mode === "online") {
        const want = delayFor(info.snaps, info.clockOff);
        // Grows at up to a fifth of real time (so the picture slows a little), shrinks at a twentieth.
        delay = want > delay ? Math.min(want, delay + info.dt * 1000 * 0.2) : Math.max(want, delay - info.dt * 1000 * 0.05);
      }
      const world = worldOf(info, info.now);
      if (!world) return;
      controlsEl.hidden = !!info.over;
      if (me && me.alive && !world.over) {
        if (heldDir !== null) {
          sim.turn(world, me, heldDir);
          const blockers = [...world.enemies, ...world.tanks.filter((x) => x.alive && x.seat !== info.me)];
          me.moving = sim.drive(world, me, PLAYER_SPEED * info.dt, blockers) > 0;
        } else me.moving = false;
        const key = `${me.x.toFixed(1)},${me.y.toFixed(1)},${me.d},${me.moving ? 1 : 0},${me.life}`;
        // Here, the game takes every position at once; online, about 15 a second (and one a second while still).
        const gap = info.mode === "online" ? SEND_MS : 0;
        if (info.now - lastSent.at >= gap && (key !== lastSent.key || info.now - lastSent.at > 1000)) {
          if (info.act({ t: "me", x: +me.x.toFixed(2), y: +me.y.toFixed(2), d: me.d, m: me.moving ? 1 : 0, life: me.life })) lastSent = { at: info.now, key };
        }
        if (info.mode !== "online") { if (firing) info.act({ t: "fire" }); }
        // Online, one shell at a time, shown flying at once. The next can go once this one has landed: the server's copy
        // lands about as much later as the next Fire takes to reach it.
        else if (firing && !myShell && info.now - lastFire > 250 && info.act({ t: "fire" })) {
          lastFire = info.now;
          myShell = { x: me.x + 4 + DIRS[me.d][0] * 4, y: me.y + 4 + DIRS[me.d][1] * 4, d: me.d, speed: SHELL_SPEED };
          myLine = { d: me.d, across: me.d % 2 ? myShell.y : myShell.x, until: Infinity };
        }
      }
      // This player's shell flies on, until it hits a wall or an enemy (the server says what it broke) or the game ends.
      if (myShell && (world.over || !me?.alive || sim.flyShell(world, myShell, info.dt, world.enemies))) {
        myShell = null;
        // The server's copy lands about as much later as it's drawn in the past: keep it hidden until then.
        myLine.until = info.now + delay + 150;
      }
      if (myShell && !world.shells.includes(myShell)) world.shells.push(myShell);
      if (myLine && !myShell && info.now > myLine.until) myLine = null;
      draw(world, info.now);
      hud(world, info);
    }

    // ---------- drawing ----------
    function drawGround(w) {
      const g2 = gctx, s = px;
      g2.fillStyle = "#111113"; g2.fillRect(0, 0, ground.width, ground.height);
      for (let i = 0; i < N * N; i++) {
        const x = (i % N) * CELL * s, y = Math.floor(i / N) * CELL * s, c = CELL * s;
        const t = w.layout[i];
        if (t === BRICK && w.bricks[i]) {
          g2.fillStyle = "#9c4a1e"; g2.fillRect(x, y, c, c);
          g2.fillStyle = "#c46a2f"; g2.fillRect(x, y, c - s * 0.4, c / 2 - s * 0.4); g2.fillRect(x, y + c / 2, c / 2 - s * 0.4, c / 2 - s * 0.4); g2.fillRect(x + c / 2, y + c / 2, c / 2, c / 2 - s * 0.4);
        } else if (t === STEEL) {
          g2.fillStyle = "#7d848b"; g2.fillRect(x, y, c, c);
          g2.fillStyle = "#c9ced3"; g2.fillRect(x + c * 0.22, y + c * 0.22, c * 0.56, c * 0.56);
        } else if (t === WATER) {
          g2.fillStyle = "#2457a8"; g2.fillRect(x, y, c, c);
          g2.fillStyle = "#4f86d9"; g2.fillRect(x + c * 0.15, y + c * 0.3, c * 0.4, s * 0.5); g2.fillRect(x + c * 0.45, y + c * 0.7, c * 0.4, s * 0.5);
        }
      }
      // The eagle, on its 2×2 cells.
      const bx = BASE_X * s, by = BASE_Y * s, bw = TANK * s;
      if (w.base) {
        g2.fillStyle = "#d8d8dc";
        g2.beginPath(); g2.moveTo(bx + bw * 0.5, by + bw * 0.12); g2.lineTo(bx + bw * 0.92, by + bw * 0.5); g2.lineTo(bx + bw * 0.62, by + bw * 0.5);
        g2.lineTo(bx + bw * 0.62, by + bw * 0.9); g2.lineTo(bx + bw * 0.38, by + bw * 0.9); g2.lineTo(bx + bw * 0.38, by + bw * 0.5); g2.lineTo(bx + bw * 0.08, by + bw * 0.5); g2.closePath(); g2.fill();
        g2.fillStyle = "#e0a019"; g2.beginPath(); g2.arc(bx + bw * 0.5, by + bw * 0.38, bw * 0.1, 0, 7); g2.fill();
      } else {
        g2.fillStyle = "#3a3a3e"; g2.fillRect(bx + bw * 0.1, by + bw * 0.45, bw * 0.8, bw * 0.45);
        g2.strokeStyle = "#777"; g2.lineWidth = s * 0.6; g2.beginPath(); g2.moveTo(bx + bw * 0.2, by + bw * 0.2); g2.lineTo(bx + bw * 0.8, by + bw * 0.85); g2.moveTo(bx + bw * 0.8, by + bw * 0.2); g2.lineTo(bx + bw * 0.2, by + bw * 0.85); g2.stroke();
      }
    }

    function drawTank(x, y, d, colour, opts = {}) {
      const s = px;
      ctx.save();
      ctx.translate((x + 4) * s, (y + 4) * s);
      ctx.rotate(d * Math.PI / 2);
      ctx.fillStyle = "#2c2c30";
      ctx.fillRect(-4 * s, -4 * s, 2.2 * s, 8 * s); ctx.fillRect(1.8 * s, -4 * s, 2.2 * s, 8 * s);
      ctx.fillStyle = "#56565c";
      const off = ((x + y) % 2) * s;
      for (let k = -4; k < 4; k += 2) { ctx.fillRect(-4 * s, (k + 0.3) * s + off * 0.5, 2.2 * s, 0.6 * s); ctx.fillRect(1.8 * s, (k + 0.3) * s + off * 0.5, 2.2 * s, 0.6 * s); }
      ctx.fillStyle = opts.flash ? "#ffffff" : colour;
      ctx.fillRect(-2.4 * s, -3 * s, 4.8 * s, 6.4 * s);
      ctx.fillStyle = "rgba(0,0,0,0.28)";
      ctx.beginPath(); ctx.arc(0, 0.5 * s, 1.8 * s, 0, 7); ctx.fill();
      ctx.fillStyle = opts.flash ? "#ffffff" : colour;
      ctx.beginPath(); ctx.arc(0, 0.5 * s, 1.35 * s, 0, 7); ctx.fill();
      ctx.fillStyle = "#3a3a40";
      ctx.fillRect(-0.55 * s, -4.6 * s, 1.1 * s, 4.4 * s);
      ctx.restore();
      if (opts.shield) {
        ctx.strokeStyle = `rgba(255,255,255,${0.5 + 0.4 * Math.sin(Date.now() / 60)})`; ctx.lineWidth = s * 0.5;
        ctx.strokeRect((x - 0.6) * s, (y - 0.6) * s, (TANK + 1.2) * s, (TANK + 1.2) * s);
      }
    }
    const seatColour = (s) => getComputedStyle(document.documentElement).getPropertyValue(`--p${s % 4}`).trim() || "#e8b730";
    let colours = [0, 1, 2, 3].map(seatColour);
    matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { colours = [0, 1, 2, 3].map(seatColour); });

    function draw(w, now) {
      const key = `${w.wave}|${w.base}|${sim.encBricks(w.bricks)}|${canvas.width}`;
      if (key !== groundKey) { drawGround(w); groundKey = key; }
      ctx.drawImage(ground, 0, 0);
      for (const e of w.enemies) drawTank(e.x, e.y, e.d, e.kind === 3 ? ARMOUR_COLOURS[Math.max(0, Math.min(4, e.hp))] : KIND_COLOURS[e.kind], { flash: e.flash });
      for (const t of w.tanks) if (t.alive) drawTank(t.x, t.y, t.d, colours[t.seat % 4], { shield: t.shield });
      ctx.fillStyle = "#f4f4f4";
      for (const s of w.shells) ctx.fillRect((s.x - 0.9) * px, (s.y - 0.9) * px, 1.8 * px, 1.8 * px);
      // Trees on top
      for (let i = 0; i < N * N; i++) {
        if (w.layout[i] !== TREES) continue;
        const x = (i % N) * CELL * px, y = Math.floor(i / N) * CELL * px, c = CELL * px;
        ctx.globalAlpha = 0.93;
        ctx.fillStyle = "#2f7a34"; ctx.fillRect(x, y, c, c);
        ctx.fillStyle = "#4ea152";
        ctx.beginPath(); ctx.arc(x + c * 0.3, y + c * 0.3, c * 0.22, 0, 7); ctx.arc(x + c * 0.72, y + c * 0.6, c * 0.24, 0, 7); ctx.fill();
        ctx.globalAlpha = 1;
      }
      // Explosions: each boom the game reports, once.
      for (const b of w.booms) if (!seenBooms.has(b.id)) { seenBooms.add(b.id); effects.push({ ...b, at: now }); }
      if (seenBooms.size > 400) seenBooms = new Set([...seenBooms].slice(-200));
      effects = effects.filter((f) => now - f.at < 450);
      for (const f of effects) {
        const p = (now - f.at) / 450, r = (f.big ? 7 : 3) * (0.4 + p) * px;
        ctx.globalAlpha = 1 - p;
        ctx.fillStyle = "#ffb13b"; ctx.beginPath(); ctx.arc(f.x * px, f.y * px, r, 0, 7); ctx.fill();
        ctx.fillStyle = "#fff3c4"; ctx.beginPath(); ctx.arc(f.x * px, f.y * px, r * 0.5, 0, 7); ctx.fill();
        ctx.globalAlpha = 1;
      }
      const text = w.over ? "GAME OVER" : w.banner;
      if (text) {
        ctx.font = `800 ${Math.round(9 * px)}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillStyle = "rgba(0,0,0,0.55)"; ctx.fillText(text, 52.5 * px, 46.5 * px);
        ctx.fillStyle = w.over ? "#ff6a5f" : "#ffffff"; ctx.fillText(text, 52 * px, 46 * px);
      }
    }


    let hudText = "";
    function hud(w, info) {
      const mine = w.tanks.find((t) => t.seat === info.me);
      const status = mine && !mine.alive ? (mine.out ? "Out of lives: hold on, clearing a wave brings you back." : "Back in a moment…") : "";
      const t = `${w.wave}|${w.lives}|${w.left}|${status}`;
      if (t === hudText) return;
      hudText = t;
      hudEl.innerHTML = `<span>Wave ${w.wave}</span><span>❤ ${w.lives} spare</span><span>Enemies ${w.left}</span>`;
      hintEl.textContent = status;
    }

    // ---------- the board and controls ----------
    function setup(stage) {
      stage.innerHTML = `
        <div class="hud" id="hud"></div>
        <canvas id="arena" aria-label="Battlefield"></canvas>
        <p class="hint" id="tank-hint"></p>
        <div class="controls" id="controls">
          <div class="pad" id="pad" aria-label="Drive"><i data-d="0">▲</i><i data-d="1">▶</i><i data-d="2">▼</i><i data-d="3">◀</i></div>
          <button class="fire" id="fire" aria-label="Fire">FIRE</button>
        </div>`;
      canvas = stage.querySelector("#arena"); ctx = canvas.getContext("2d");
      ground = document.createElement("canvas"); gctx = ground.getContext("2d"); groundKey = "";
      hudEl = stage.querySelector("#hud"); controlsEl = stage.querySelector("#controls"); hintEl = stage.querySelector("#tank-hint");
      me = null; effects = []; seenBooms = new Set(); hudText = ""; lastSent = { at: 0, key: "" };
      myShell = null; myLine = null; delay = DELAY_MIN;
      const resize = () => {
        const size = Math.round((canvas.getBoundingClientRect().width || 300) * Math.min(devicePixelRatio || 1, 3));
        if (canvas.width !== size) { canvas.width = canvas.height = ground.width = ground.height = size; groundKey = ""; }
        px = size / U;
      };
      new ResizeObserver(resize).observe(canvas);
      // The pad: press and slide a finger; the direction follows it.
      const pad = stage.querySelector("#pad"), padKeys = [...pad.querySelectorAll("i")];
      let padPointer = null;
      const padDir = (e) => {
        const r = pad.getBoundingClientRect();
        const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
        if (Math.hypot(dx, dy) < 14) return null;
        return Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0);
      };
      setDir = (d) => { heldDir = d; for (const k of padKeys) k.classList.toggle("on", Number(k.dataset.d) === d); };
      pad.addEventListener("pointerdown", (e) => { padPointer = e.pointerId; pad.setPointerCapture(e.pointerId); setDir(padDir(e)); e.preventDefault(); });
      pad.addEventListener("pointermove", (e) => { if (e.pointerId === padPointer) setDir(padDir(e)); });
      for (const ev of ["pointerup", "pointercancel", "lostpointercapture"]) pad.addEventListener(ev, (e) => { if (e.pointerId === padPointer) { padPointer = null; setDir(keysDown.length ? keysDown[keysDown.length - 1] : null); } });
      const fireBtn = stage.querySelector("#fire");
      setFire = (on) => { firing = on; fireBtn.classList.toggle("on", on); };
      fireBtn.addEventListener("pointerdown", (e) => { fireBtn.setPointerCapture(e.pointerId); setFire(true); e.preventDefault(); });
      for (const ev of ["pointerup", "pointercancel", "lostpointercapture"]) fireBtn.addEventListener(ev, () => setFire(false));
      for (const el of [pad, fireBtn, canvas]) el.addEventListener("contextmenu", (e) => e.preventDefault());
      setDir(null); setFire(false);
    }
    let setDir = (d) => { heldDir = d; }, setFire = (on) => { firing = on; };
    const KEYS = { ArrowUp: 0, KeyW: 0, ArrowRight: 1, KeyD: 1, ArrowDown: 2, KeyS: 2, ArrowLeft: 3, KeyA: 3 };
    addEventListener("keydown", (e) => {
      if (!kit.mode || e.target.closest?.("input")) return;
      if (e.code in KEYS) {
        const d = KEYS[e.code];
        if (!keysDown.includes(d)) keysDown.push(d);
        setDir(d); e.preventDefault();
      } else if (e.code === "Space" || e.code === "KeyJ") { setFire(true); e.preventDefault(); }
    });
    addEventListener("keyup", (e) => {
      if (e.code in KEYS) {
        const i = keysDown.indexOf(KEYS[e.code]); if (i >= 0) keysDown.splice(i, 1);
        setDir(keysDown.length ? keysDown[keysDown.length - 1] : null);
      } else if (e.code === "Space" || e.code === "KeyJ") setFire(false);
    });
    addEventListener("blur", () => { keysDown.length = 0; setDir(null); setFire(false); });

    const kit = start(game, {
      title: "Tanks",
      logo: `<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="2" width="4" height="12" rx="1" fill="#555"/><rect x="11" y="2" width="4" height="12" rx="1" fill="#555"/><rect x="4" y="4" width="8" height="9" rx="1.5" fill="var(--p0)"/><rect x="7" y="0" width="2" height="7" fill="#777"/><circle cx="8" cy="9" r="2.4" fill="#a87d0a"/></svg>`,
      soloText: "Hold off the waves alone. Works offline.",
      onlineText: "Create a room for 2–4 players and send the code or link. Start once everyone's in.",
      howTo: `<ul>
        <li>Enemy tanks roll in from the top. Keep them away from the eagle at the bottom: if it's hit, the game is over.</li>
        <li>Drive with the pad (or arrow keys / WASD) and tap Fire (or Space). One shell at a time.</li>
        <li>Shells break bricks; steel and water stop you. You can hide under trees.</li>
        <li>Your team shares its spare lives. Clearing a wave earns one more.</li>
        <li>Grey tanks are steady, light ones fast, bronze ones shoot fast shells, and dark armoured ones take four hits.</li>
        <li>Online, the game carries on if someone leaves; they can rejoin with the code.</li>
      </ul>`,
      leaderboard: { order: "high", format: (n) => `${n} wave${Number(n) === 1 ? "" : "s"}`, valid: (n) => Number.isInteger(n) && n >= 1 && n <= 999 },
      setup,
      frame,
      resultText: (r) => ({
        title: r.timeUp ? "Time's up" : r.base ? "The eagle fell" : "Out of tanks",
        text: r.waves ? `Your team cleared ${r.waves} wave${r.waves === 1 ? "" : "s"}.` : "No waves cleared this time.",
      }),
    });

    // Hooks for automated tests (with window.__kit).
    window.__tanks = {
      sim, kit,
      get me() { return me; },
      world: () => { const i = kit.info; return i && worldOf(i, Date.now()); },
      hold: (d) => setDir(d), fire: (on) => setFire(on),
    };
  </script>
</body>
</html>
