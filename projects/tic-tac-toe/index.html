<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#f7f6f3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161618" media="(prefers-color-scheme: dark)">
  <title>Tic-tac-toe</title>
  <meta name="description" content="Play a friend online with a room code, or pass the phone on one device.">
  <style>
    :root {
      --bg: #f7f6f3;
      --text: #1d1d1f;
      --muted: #6b6b70;
      --panel: #ffffff;
      --line: #d9d2c6;
      --soft: #ece7df;
      --x: #c2571a;
      --o: #2f7f8f;
      --win: #f6e2c8;
      --danger: #b3261e;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161618;
        --text: #ececef;
        --muted: #9a9aa2;
        --panel: #1f1f22;
        --line: #3a3a40;
        --soft: #2a2a2e;
        --x: #f08a4b;
        --o: #5cc3d1;
        --win: #3a2a1c;
        --danger: #ff8a80;
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }
    main {
      width: 100%;
      max-width: 440px;
      padding: max(20px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    h1 { margin: 0; font-size: clamp(1.9rem, 9vw, 2.4rem); line-height: 1.1; letter-spacing: -0.02em; }
    h1 .x { color: var(--x); } h1 .o { color: var(--o); }
    .muted { color: var(--muted); }
    [hidden] { display: none !important; }
    #game { display: flex; flex-direction: column; gap: 14px; }

    button, input {
      font: inherit;
      border-radius: 12px;
      touch-action: manipulation;
    }
    button {
      border: 0;
      padding: 13px 18px;
      font-weight: 650;
      background: var(--x);
      color: #fff;
      cursor: pointer;
    }
    button.secondary { background: var(--soft); color: var(--text); }
    button.link { background: none; color: var(--muted); padding: 6px 0; font-weight: 500; text-decoration: underline; }
    button:disabled { opacity: 0.45; cursor: default; }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card h2 { margin: 0; font-size: 1.05rem; }
    .card p { margin: 0; }
    .join { display: flex; gap: 8px; }
    .join input {
      flex: 1;
      min-width: 0;
      padding: 12px 14px;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--text);
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      text-align: center;
    }
    .error { color: var(--danger); font-size: 0.95rem; min-height: 1.3em; margin: 0; }

    .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .code {
      font-size: 0.85rem;
      color: var(--muted);
    }
    .code b { color: var(--text); letter-spacing: 0.12em; font-size: 1rem; }
    .players { display: flex; gap: 8px; }
    .chip {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--soft);
      font-size: 0.9rem;
      font-weight: 600;
      border: 2px solid transparent;
    }
    .chip.turn.x { border-color: var(--x); }
    .chip.turn.o { border-color: var(--o); }
    .chip .mark { font-weight: 800; }
    .chip.x .mark { color: var(--x); } .chip.o .mark { color: var(--o); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); opacity: 0.4; }
    .dot.on { background: #2e9d5b; opacity: 1; }

    .status { text-align: center; font-size: 1.25rem; font-weight: 700; min-height: 1.5em; margin: 0; }

    .board {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      grid-template-rows: repeat(3, minmax(0, 1fr));
      gap: 8px;
      width: 100%;
      aspect-ratio: 1;
      padding: 8px;
      background: var(--line);
      border-radius: 18px;
      container-type: inline-size;
    }
    .cell {
      border-radius: 12px;
      background: var(--panel);
      display: grid;
      place-items: center;
      font-size: 22cqi;
      font-weight: 800;
      line-height: 1;
      padding: 0;
      min-height: 0;
      overflow: hidden;
      color: var(--text);
      transition: background 120ms ease;
    }
    .cell.x { color: var(--x); }
    .cell.o { color: var(--o); }
    .cell.win { background: var(--win); }
    .cell.placed span { animation: place 160ms ease-out; display: block; }
    .cell:disabled { opacity: 1; cursor: default; }
    @keyframes place { from { transform: scale(0.4); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .cell.placed span { animation: none; } }

    .share { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
    .bigcode { font-size: clamp(2.6rem, 16vw, 3.4rem); font-weight: 800; letter-spacing: 0.18em; margin: 0; padding-left: 0.18em; }
    .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    .footer { display: flex; justify-content: center; }
  </style>
</head>
<body>
  <main>
    <h1>Tic-<span class="x">tac</span>-<span class="o">toe</span></h1>

    <!-- Home -->
    <section id="home">
      <div class="card">
        <h2>Play a friend online</h2>
        <p class="muted">Create a room and send your friend the code or link.</p>
        <button id="create">Create room</button>
      </div>
      <div class="card" style="margin-top: 12px">
        <h2>Join a room</h2>
        <form class="join" id="join-form" autocomplete="off">
          <input id="join-code" maxlength="4" inputmode="text" autocapitalize="characters" spellcheck="false" placeholder="CODE" aria-label="Room code">
          <button id="join" type="submit">Join</button>
        </form>
        <p class="error" id="home-error" role="alert"></p>
      </div>
      <div class="card" style="margin-top: 12px">
        <h2>Same device</h2>
        <p class="muted">Take turns on this phone. Works offline.</p>
        <button class="secondary" id="local">Play here</button>
      </div>
    </section>

    <!-- Game -->
    <section id="game" hidden>
      <div class="bar">
        <div class="players" id="players"></div>
        <div class="code" id="room-label"></div>
      </div>

      <div class="share card" id="waiting" hidden>
        <p class="muted">Send this code to a friend</p>
        <p class="bigcode" id="waiting-code"></p>
        <div class="row">
          <button id="share">Share link</button>
          <button class="secondary" id="copy">Copy code</button>
        </div>
        <p class="muted" style="font-size: 0.9rem">Waiting for them to join…</p>
      </div>

      <p class="status" id="status" aria-live="polite"></p>
      <div class="board" id="board" role="grid" aria-label="Board"></div>

      <div class="row">
        <button id="rematch" hidden>Play again</button>
        <button class="secondary" id="leave">Leave</button>
      </div>
    </section>

    <p class="footer muted" id="conn" style="font-size: 0.85rem; margin: 0"></p>
  </main>

  <script type="module">
    import * as rooms from "../shared/rooms.js";

    const GAME = "tic-tac-toe";
    const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

    // ---------- game rules ----------
    function outcome(board) {
      for (const line of LINES) {
        const [a, b, c] = line;
        if (board[a] !== "-" && board[a] === board[b] && board[a] === board[c]) return { winner: board[a], line: line.join("") };
      }
      if (!board.includes("-")) return { winner: "draw", line: null };
      return null;
    }

    function freshRound(room, round) {
      room.board = "---------";
      room.round = round;
      room.turn = round % 2 === 0 ? "x" : "o"; // starter alternates each round
      room.status = room.o ? "playing" : "waiting";
      room.winner = null;
      room.line = null;
      room.left = null;
      return room;
    }

    // ---------- seats ↔ marks ----------
    // Rooms number their seats (0, 1); the game works in marks: seat 0 is "x", seat 1 is "o".
    const MARK = ["x", "o"];
    function toView(r) {
      return {
        ...r,
        turn: MARK[r.turn],
        winner: typeof r.winner === "number" ? MARK[r.winner] : r.winner ?? null,
        left: typeof r.left === "number" ? MARK[r.left] : null,
        x: r.players?.s0 ?? null,
        o: r.players?.s1 ?? null,
        online: { x: rooms.isOnline(r, 0), o: rooms.isOnline(r, 1) },
      };
    }
    function fromView(v, orig) {
      const r = { ...orig, board: v.board, round: v.round, status: v.status, line: v.line ?? null };
      r.turn = MARK.indexOf(v.turn);
      r.winner = v.winner == null ? null : v.winner === "draw" ? "draw" : MARK.indexOf(v.winner);
      r.left = v.left == null ? null : MARK.indexOf(v.left);
      return r;
    }
    // A transaction written against the mark view of the room.
    function vtransact(fn) {
      return seat.backend.transact(seat.code, (cur) => {
        if (!cur) return undefined;
        const out = fn(toView(cur));
        return out === undefined ? undefined : fromView(out, cur);
      });
    }
    const initialRoom = () => ({ board: "---------", round: 0, turn: 0 });

    // ---------- state ----------
    let seat = null;   // { backend, code, seat, side } — side is "x"/"o", or "both" on one device
    let leave = null;
    let room = null;
    let lastBoard = null;

    const $ = (id) => document.getElementById(id);
    const els = {
      home: $("home"), game: $("game"), homeError: $("home-error"), joinCode: $("join-code"),
      players: $("players"), roomLabel: $("room-label"), waiting: $("waiting"), waitingCode: $("waiting-code"),
      status: $("status"), board: $("board"), rematch: $("rematch"), conn: $("conn"),
    };

    els.board.innerHTML = Array.from({ length: 9 }, (_, i) =>
      `<button class="cell" data-i="${i}" aria-label="Square ${i + 1}"><span></span></button>`).join("");
    const cells = [...els.board.children];

    function setBusy(busy) {
      for (const id of ["create", "join", "local"]) $(id).disabled = busy;
    }

    function showHome(error = "") {
      if (leave) leave();
      leave = null;
      seat = room = lastBoard = null;
      els.game.hidden = true;
      els.home.hidden = false;
      els.homeError.textContent = error;
      setBusy(false);
    }

    function start(s) {
      seat = { ...s, side: s.seat === "local" ? "both" : MARK[s.seat] };
      lastBoard = null;
      els.home.hidden = true;
      els.game.hidden = false;
      leave = rooms.enter(s, (value) => { room = toView(value); render(); }, showHome);
    }

    // ---------- actions ----------
    async function createRoom() {
      setBusy(true);
      els.homeError.textContent = "";
      try {
        start(await rooms.createRoom(GAME, { seats: 2, makeRoom: initialRoom }));
      } catch (err) {
        console.error(err);
        showHome(err instanceof rooms.RoomError ? err.message : "Couldn't create a room. Check your connection and try again.");
      }
    }

    async function joinRoom(code) {
      setBusy(true);
      els.homeError.textContent = "";
      try {
        start(await rooms.joinRoom(GAME, code));
      } catch (err) {
        console.error(err);
        showHome(err instanceof rooms.RoomError ? err.message : "Couldn't join. Check your connection and try again.");
      }
    }

    function playLocal() {
      start(rooms.localRoom(GAME, 2, initialRoom));
    }

    function play(i) {
      if (!room || room.status !== "playing") return;
      const { side, backend } = seat;
      if (side !== "both" && room.turn !== side) return;
      const mover = room.turn;
      vtransact((cur) => {
        if (cur.status !== "playing" || cur.turn !== mover || cur.board[i] !== "-") return undefined;
        if (side !== "both" && cur[mover] !== backend.uid) return undefined;
        cur.board = cur.board.slice(0, i) + mover + cur.board.slice(i + 1);
        const result = outcome(cur.board);
        if (result) {
          cur.status = "done";
          cur.winner = result.winner;
          cur.line = result.line;
        } else {
          cur.turn = mover === "x" ? "o" : "x";
        }
        return cur;
      }).catch((err) => { console.error(err); els.status.textContent = "Move didn't go through. Try again."; });
    }

    function rematch() {
      if (!room || room.status !== "done") return;
      const round = room.round + 1;
      vtransact((cur) => {
        if (cur.status !== "done" || cur.round !== round - 1) return undefined;
        return freshRound(cur, round);
      }).catch((err) => console.error(err));
    }

    // ---------- rendering ----------
    function render() {
      const r = room;
      const { side, code } = seat;
      const local = side === "both";
      const online = r.online || {};
      const other = side === "x" ? "o" : "x";

      els.roomLabel.innerHTML = local ? "Same device" : `Room <b>${code}</b>`;
      const chip = (s, label, dot) =>
        `<span class="chip ${s}${r.status === "playing" && r.turn === s ? " turn" : ""}">` +
        `<span class="mark">${s.toUpperCase()}</span>${label}${dot === undefined ? "" : `<span class="dot${dot ? " on" : ""}"></span>`}</span>`;
      els.players.innerHTML = local
        ? chip("x", "", undefined) + chip("o", "", undefined)
        : chip(side, "You", true) + (r.o ? chip(other, "Friend", !!online[other]) : "");

      els.waiting.hidden = r.status !== "waiting";
      els.waitingCode.textContent = code;
      els.board.hidden = r.status === "waiting";

      const winLine = r.line ? r.line.split("").map(Number) : [];
      cells.forEach((cell, i) => {
        const v = r.board[i];
        const was = lastBoard ? lastBoard[i] : v;
        cell.className = "cell" + (v !== "-" ? " " + v : "") + (winLine.includes(i) ? " win" : "") + (v !== "-" && was === "-" ? " placed" : "");
        cell.firstChild.textContent = v === "-" ? "" : v.toUpperCase();
        const myTurn = r.status === "playing" && (local || r.turn === side);
        cell.disabled = !(myTurn && v === "-");
        cell.setAttribute("aria-label", `Square ${i + 1}: ${v === "-" ? "empty" : v.toUpperCase()}`);
      });
      lastBoard = r.board;

      let status = "";
      if (r.status === "waiting") status = "";
      else if (r.status === "playing") {
        if (local) status = `${r.turn.toUpperCase()} to play`;
        else if (!online[other]) status = r.turn === side ? "Your turn (friend is away)" : "Friend is away…";
        else status = r.turn === side ? "Your turn" : "Friend's turn…";
      } else if (r.winner === "draw") status = "It's a draw";
      else if (local) status = `${r.winner.toUpperCase()} wins!`;
      else if (r.left === other) status = "Your friend left. You win 🎉";
      else if (r.left === side) status = "You left this game";
      else status = r.winner === side ? "You win! 🎉" : "Friend wins";
      els.status.textContent = status;
      // After a friend leaves, Play again waits until they're back.
      els.rematch.hidden = r.status !== "done" || (r.left === other && !online[other]);
    }

    // ---------- wiring ----------
    $("create").addEventListener("click", createRoom);
    $("join-form").addEventListener("submit", (e) => { e.preventDefault(); joinRoom(els.joinCode.value); });
    $("local").addEventListener("click", playLocal);
    $("leave").addEventListener("click", async () => {
      if (!seat || !room) return showHome();
      const s = seat;
      // Mid-game, leaving forfeits: make sure it's meant. An absent friend or a finished game needs no check.
      if (room.status === "playing" && s.side !== "both" && room.online[s.side === "x" ? "o" : "x"] &&
          !confirm("Leave the game? Your friend wins this round.")) return;
      $("leave").disabled = true;
      await rooms.quit(s);
      $("leave").disabled = false;
      showHome();
    });
    els.rematch.addEventListener("click", rematch);
    els.board.addEventListener("click", (e) => {
      const cell = e.target.closest(".cell");
      if (cell && !cell.disabled) play(Number(cell.dataset.i));
    });
    els.joinCode.addEventListener("input", () => {
      els.joinCode.value = els.joinCode.value.toUpperCase().replace(/[^A-Z0-9]/g, "");
      els.homeError.textContent = "";
    });
    $("share").addEventListener("click", async () => {
      if ((await rooms.share(seat.code, "Tic-tac-toe")) === "copied") $("share").textContent = "Link copied";
    });
    $("copy").addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(seat.code); $("copy").textContent = "Copied"; } catch { prompt("Room code:", seat.code); }
      setTimeout(() => ($("copy").textContent = "Copy code"), 1500);
    });

    // Opening a shared link (?room=CODE) joins straight away.
    const linked = rooms.roomFromUrl();
    if (linked) { els.joinCode.value = linked.toUpperCase(); joinRoom(linked); }

    // Hooks for automated tests.
    window.__ttt = {
      state: () => ({ code: seat?.code ?? null, side: seat?.side ?? null, room, uid: seat?.backend?.uid ?? null }),
      rooms,
    };
  </script>
</body>
</html>
