<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#f7f6f3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161618" media="(prefers-color-scheme: dark)">
  <title>2048</title>
  <meta name="description" content="Slide and merge tiles to reach 2048. Swipe on a phone, arrow keys on a keyboard.">
  <style>
    :root {
      --bg: #f7f6f3;
      --text: #1d1d1f;
      --muted: #6b6b70;
      --board: #d9d2c6;
      --cell: #e9e3d9;
      --panel: #ffffff;
      --accent: #c2571a;
      --overlay: rgba(247, 246, 243, 0.82);
      --t2: #f8f4ec;   --t2-text: #4a4237;
      --t4: #f1e3c8;   --t4-text: #4a4237;
      --t8: #f4b67a;   --t16: #f39a5b;   --t32: #ef7d4e;   --t64: #e5593a;
      --t128: #e9c95c; --t256: #e4ba43; --t512: #dfab2e;  --t1024: #62ad7a;
      --t2048: #2f9585; --tsuper: #2f3b52;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161618;
        --text: #ececef;
        --muted: #9a9aa2;
        --board: #2a2a2e;
        --cell: #34343a;
        --panel: #1f1f22;
        --accent: #f08a4b;
        --overlay: rgba(22, 22, 24, 0.84);
        --t2: #4a4540;   --t2-text: #f1ebe2;
        --t4: #5c5244;   --t4-text: #f1ebe2;
        --tsuper: #8d9bd6;
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      overscroll-behavior: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .game {
      width: 100%;
      max-width: 480px;
      padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header { display: flex; align-items: center; gap: 8px; }
    h1 { margin: 0 auto 0 0; font-size: clamp(2.2rem, 11vw, 3rem); line-height: 1; font-weight: 800; letter-spacing: -0.02em; }
    .score {
      min-width: 64px;
      padding: 6px 10px;
      border-radius: 10px;
      background: var(--board);
      text-align: center;
      line-height: 1.15;
    }
    .score span { display: block; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
    .score b { font-size: 1.15rem; font-variant-numeric: tabular-nums; }

    .actions { display: flex; gap: 8px; }
    .actions p { margin: 0 auto 0 0; align-self: center; color: var(--muted); font-size: 0.85rem; line-height: 1.3; }
    button {
      font: inherit;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 9px 16px;
      border-radius: 10px;
      border: 0;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      touch-action: manipulation;
      white-space: nowrap;
    }
    button.secondary { background: var(--board); color: var(--text); }
    button:disabled { opacity: 0.4; cursor: default; }

    .board {
      --gap: 3%;
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      border-radius: 14px;
      background: var(--board);
      touch-action: none;
      container-type: inline-size;
    }
    .cells, .tiles { position: absolute; inset: var(--gap); }
    .cells { display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); gap: calc(var(--gap) * 100 / 94); }
    .cells div { background: var(--cell); border-radius: 8px; }

    /* Inside .tiles, percentages are of the inner (square) area: --g is the gap, --s the tile size. */
    .tiles { --g: calc(var(--gap) * 100 / 94); --s: calc((100% - 3 * var(--g)) / 4); }
    .tile {
      position: absolute;
      width: var(--s);
      height: var(--s);
      left: calc(var(--c) * (var(--s) + var(--g)));
      top: calc(var(--r) * (var(--s) + var(--g)));
      transition: left 100ms ease-in-out, top 100ms ease-in-out;
      z-index: 1;
    }
    .tile .inner {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      border-radius: 8px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      font-size: 10cqi;
      color: #fff;
      background: var(--tsuper);
    }
    .tile.d3 .inner { font-size: 8.5cqi; }
    .tile.d4 .inner { font-size: 7cqi; }
    .tile.d5 .inner { font-size: 5.6cqi; }
    .tile.v2 .inner { background: var(--t2); color: var(--t2-text); }
    .tile.v4 .inner { background: var(--t4); color: var(--t4-text); }
    .tile.v8 .inner { background: var(--t8); }
    .tile.v16 .inner { background: var(--t16); }
    .tile.v32 .inner { background: var(--t32); }
    .tile.v64 .inner { background: var(--t64); }
    .tile.v128 .inner { background: var(--t128); }
    .tile.v256 .inner { background: var(--t256); }
    .tile.v512 .inner { background: var(--t512); }
    .tile.v1024 .inner { background: var(--t1024); }
    .tile.v2048 .inner { background: var(--t2048); }
    .tile.dying { z-index: 0; }
    .tile.new .inner { animation: appear 140ms ease-out 60ms backwards; }
    .tile.pop .inner { animation: pop 160ms ease-out; }
    .tile.pop { z-index: 2; }
    @keyframes appear { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.14); } 100% { transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) {
      .tile { transition: none; }
      .tile.new .inner, .tile.pop .inner { animation: none; }
    }

    .message {
      position: absolute;
      inset: 0;
      z-index: 5;
      border-radius: 14px;
      background: var(--overlay);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      text-align: center;
      animation: fade 300ms ease-out;
    }
    .message.show { display: flex; }
    .message h2 { margin: 0; font-size: clamp(2rem, 10vw, 2.8rem); }
    .message p { margin: 0; color: var(--muted); }
    .message .buttons { display: flex; gap: 8px; }
    @keyframes fade { from { opacity: 0; } }

    .hint { margin: 0; color: var(--muted); font-size: 0.9rem; text-align: center; }

    .leaders {
      background: var(--panel);
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .leaders-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .leaders h2 { margin: 0; font-size: 1.05rem; }
    .leaders .note { color: var(--muted); font-size: 0.85rem; }
    .leaders ol { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 2px; }
    .leaders li {
      display: grid;
      grid-template-columns: 2em 1fr auto;
      gap: 8px;
      align-items: baseline;
      padding: 5px 8px;
      border-radius: 8px;
      font-variant-numeric: tabular-nums;
    }
    .leaders li .rank { color: var(--muted); font-size: 0.85rem; }
    .leaders li .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .leaders li .pts { font-weight: 700; }
    .leaders li.me { background: var(--board); }
    .leaders .empty { color: var(--muted); font-size: 0.9rem; margin: 0; }
    .save { display: flex; gap: 8px; }
    .save[hidden] { display: none; }
    .save input {
      flex: 1;
      min-width: 0;
      font: inherit;
      padding: 9px 12px;
      border-radius: 10px;
      border: 1px solid var(--board);
      background: var(--bg);
      color: var(--text);
    }
    .save-msg { margin: 0; font-size: 0.85rem; color: var(--muted); min-height: 1.2em; }
  </style>
</head>
<body>
  <main class="game">
    <header>
      <h1>2048</h1>
      <div class="score"><span>Score</span><b id="score">0</b></div>
      <div class="score"><span>Best</span><b id="best">0</b></div>
    </header>

    <div class="actions">
      <p>Join the tiles to reach <b>2048</b>.</p>
      <button class="secondary" id="undo" disabled>Undo</button>
      <button id="new">New game</button>
    </div>

    <div class="board" id="board" aria-label="Game board" role="application">
      <div class="cells" aria-hidden="true"></div>
      <div class="tiles" id="tiles"></div>
      <div class="message" id="message" role="alert">
        <h2 id="message-title"></h2>
        <p id="message-text"></p>
        <div class="buttons" id="message-buttons"></div>
      </div>
    </div>

    <p class="hint">Swipe on the board, or use the arrow keys.</p>

    <section class="leaders" aria-labelledby="leaders-title">
      <div class="leaders-head">
        <h2 id="leaders-title">Top 10</h2>
        <span class="note" id="leaders-note">Loading…</span>
      </div>
      <ol id="leader-list"></ol>
      <form class="save" id="save-form" autocomplete="off" hidden>
        <input id="save-name" maxlength="12" placeholder="Your name" aria-label="Name for the leaderboard" enterkeyhint="done">
        <button id="save-btn" type="submit">Save</button>
      </form>
      <p class="save-msg" id="save-msg" role="status"></p>
    </section>
  </main>

  <script>
    const SIZE = 4;
    const STORAGE_KEY = "reclaude-2048";
    const ANIM_MS = 100;
    const DIRS = { left: [0, -1], right: [0, 1], up: [-1, 0], down: [1, 0] };

    const tilesEl = document.getElementById("tiles");
    const scoreEl = document.getElementById("score");
    const bestEl = document.getElementById("best");
    const undoBtn = document.getElementById("undo");
    const messageEl = document.getElementById("message");

    document.querySelector(".cells").innerHTML = "<div></div>".repeat(SIZE * SIZE);

    let tiles = [];          // { id, value, r, c, dying?, newValue?, isNew?, pop? }
    let nextId = 1;
    let score = 0;
    let best = 0;
    let won = false;         // reached 2048 at least once
    let keepPlaying = false; // chose to continue after winning
    let over = false;
    let history = null;      // one-step undo snapshot
    let pending = null;      // timeout that finishes the current move
    let spawnEnabled = true; // turned off only by tests

    // ---------- storage ----------
    function load() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || null; } catch { return null; }
    }
    function save() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ grid: gridValues(), score, best, won, keepPlaying, over }));
      } catch {}
    }

    // ---------- board helpers ----------
    function liveTiles() { return tiles.filter((t) => !t.dying); }
    function gridOf(list) {
      const g = Array.from({ length: SIZE }, () => Array(SIZE).fill(null));
      for (const t of list) g[t.r][t.c] = t;
      return g;
    }
    function gridValues() {
      return gridOf(liveTiles()).map((row) => row.map((t) => (t ? t.value : 0)));
    }
    function setGridValues(values) {
      tiles = [];
      values.forEach((row, r) => row.forEach((v, c) => { if (v) tiles.push({ id: nextId++, value: v, r, c }); }));
    }
    function emptyCells() {
      const g = gridOf(liveTiles());
      const out = [];
      for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) if (!g[r][c]) out.push([r, c]);
      return out;
    }
    function spawn() {
      const cells = emptyCells();
      if (!cells.length) return;
      const [r, c] = cells[Math.floor(Math.random() * cells.length)];
      tiles.push({ id: nextId++, value: Math.random() < 0.9 ? 2 : 4, r, c, isNew: true });
    }
    function canMove() {
      const g = gridValues();
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          if (!g[r][c]) return true;
          if (c + 1 < SIZE && g[r][c] === g[r][c + 1]) return true;
          if (r + 1 < SIZE && g[r][c] === g[r + 1][c]) return true;
        }
      }
      return false;
    }

    // ---------- moves ----------
    // Slides every row/column toward the direction. Each tile merges at most once per move,
    // and merging works from the leading edge: [2,2,2,0] left → [4,2,0,0]; [2,2,4,0] → [4,4,0,0].
    function move(dir) {
      if (!DIRS[dir]) return false;
      finishMove();
      if (over || (won && !keepPlaying)) return false;

      const [dr, dc] = DIRS[dir];
      const snapshot = { grid: gridValues(), score };
      for (const t of tiles) { delete t.isNew; delete t.pop; }
      const g = gridOf(tiles);
      let moved = false;
      let gained = 0;

      for (let i = 0; i < SIZE; i++) {
        const line = [];
        for (let j = 0; j < SIZE; j++) {
          if (dc !== 0) line.push([i, dc < 0 ? j : SIZE - 1 - j]);
          else line.push([dr < 0 ? j : SIZE - 1 - j, i]);
        }
        let target = 0;
        let last = null;
        for (const [r, c] of line) {
          const t = g[r][c];
          if (!t) continue;
          if (last && !last.newValue && last.value === t.value) {
            t.r = last.r;
            t.c = last.c;
            t.dying = true;
            last.newValue = last.value * 2;
            gained += last.newValue;
            moved = true;
          } else {
            const [tr, tc] = line[target++];
            if (tr !== t.r || tc !== t.c) moved = true;
            t.r = tr;
            t.c = tc;
            last = t;
          }
        }
      }

      if (!moved) return false;
      history = snapshot;
      score += gained;
      render();
      pending = setTimeout(finishMove, ANIM_MS);
      return true;
    }

    // Removes merged-away tiles, shows doubled values, spawns a tile, checks win/lose.
    function finishMove() {
      if (!pending) return;
      clearTimeout(pending);
      pending = null;
      tiles = tiles.filter((t) => !t.dying);
      for (const t of tiles) {
        if (t.newValue) { t.value = t.newValue; delete t.newValue; t.pop = true; }
      }
      if (spawnEnabled) spawn();
      if (!won && tiles.some((t) => t.value >= 2048)) won = true;
      const wasOver = over;
      over = !canMove();
      save();
      render();
      if (over && !wasOver) loadLeaderboard(); // fresh standings for the game-over screen
    }

    function undo() {
      if (!history) return;
      finishMove();
      setGridValues(history.grid);
      score = history.score;
      history = null;
      over = false;
      save();
      render();
    }

    function newGame() {
      finishMove();
      tiles = [];
      score = 0;
      won = false;
      keepPlaying = false;
      over = false;
      history = null;
      tilesEl.innerHTML = "";
      spawn();
      spawn();
      save();
      render();
    }

    // ---------- rendering ----------
    const elements = new Map();

    function render() {
      const seen = new Set();
      for (const t of tiles) {
        seen.add(t.id);
        let el = elements.get(t.id);
        if (!el) {
          el = document.createElement("div");
          el.innerHTML = '<div class="inner"></div>';
          tilesEl.appendChild(el);
          elements.set(t.id, el);
        }
        const digits = String(t.value).length;
        el.className =
          "tile v" + (t.value > 2048 ? "super" : t.value) +
          (digits >= 3 ? " d" + Math.min(digits, 5) : "") +
          (t.dying ? " dying" : "") + (t.isNew ? " new" : "") + (t.pop ? " pop" : "");
        el.style.setProperty("--r", t.r);
        el.style.setProperty("--c", t.c);
        el.firstChild.textContent = t.value;
      }
      for (const [id, el] of elements) {
        if (!seen.has(id)) { el.remove(); elements.delete(id); }
      }

      if (score > best) best = score;
      scoreEl.textContent = score;
      bestEl.textContent = best;
      undoBtn.disabled = !history;
      renderMessage();
      renderSaveForm();
    }

    function renderMessage() {
      const title = document.getElementById("message-title");
      const text = document.getElementById("message-text");
      const buttons = document.getElementById("message-buttons");
      if (won && !keepPlaying) {
        title.textContent = "You made 2048!";
        text.textContent = `Score: ${score}`;
        buttons.innerHTML = '<button class="secondary" data-action="continue">Keep going</button><button data-action="new">New game</button>';
        messageEl.classList.add("show");
      } else if (over) {
        title.textContent = "Game over";
        text.textContent = `Score: ${score}`;
        buttons.innerHTML = (history ? '<button class="secondary" data-action="undo">Undo</button>' : "") +
          (canSave() ? '<button class="secondary" data-action="save">Save score</button>' : "") +
          '<button data-action="new">Try again</button>';
        if (canSave()) text.textContent = `Score: ${score} · a new personal best`;
        messageEl.classList.add("show");
      } else {
        messageEl.classList.remove("show");
      }
    }

    // ---------- input ----------
    document.getElementById("new").addEventListener("click", newGame);
    undoBtn.addEventListener("click", undo);
    messageEl.addEventListener("click", (e) => {
      const action = e.target.closest("button")?.dataset.action;
      if (action === "new") newGame();
      if (action === "undo") undo();
      if (action === "continue") { keepPlaying = true; save(); render(); }
      if (action === "save") { saveForm.scrollIntoView({ behavior: "smooth", block: "center" }); nameInput.focus(); }
    });

    const KEYS = {
      ArrowLeft: "left", ArrowRight: "right", ArrowUp: "up", ArrowDown: "down",
      a: "left", d: "right", w: "up", s: "down", A: "left", D: "right", W: "up", S: "down",
    };
    document.addEventListener("keydown", (e) => {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.target.closest("input, textarea")) return; // typing a name shouldn't move tiles
      if (KEYS[e.key]) { e.preventDefault(); move(KEYS[e.key]); }
      else if (e.key === "u" || e.key === "U") undo();
    });

    const board = document.getElementById("board");
    let start = null;
    board.addEventListener("pointerdown", (e) => {
      if (e.target.closest("button")) return;
      start = { x: e.clientX, y: e.clientY, id: e.pointerId };
    });
    board.addEventListener("pointerup", (e) => {
      if (!start || e.pointerId !== start.id) return;
      const dx = e.clientX - start.x;
      const dy = e.clientY - start.y;
      start = null;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
      if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? "right" : "left");
      else move(dy > 0 ? "down" : "up");
    });
    board.addEventListener("pointercancel", () => { start = null; });

    // ---------- leaderboard ----------
    // Shared top 10 in Firebase (see shared/rooms.js). Loaded only when needed, so the game itself
    // keeps working offline; saving is offered whenever the current score beats your saved best.
    const GAME_ID = "2048";
    const NAME_KEY = "reclaude-2048-name";
    const listEl = document.getElementById("leader-list");
    const noteEl = document.getElementById("leaders-note");
    const saveForm = document.getElementById("save-form");
    const nameInput = document.getElementById("save-name");
    const saveBtn = document.getElementById("save-btn");
    const saveMsg = document.getElementById("save-msg");
    const lb = { top: null, mine: null, uid: null, error: false, saving: false };
    let roomsModule = null;
    const leaderboardApi = () => (roomsModule ??= import("../shared/rooms.js"));
    const fmt = (n) => Number(n).toLocaleString("en-US");

    function canSave() {
      return lb.uid !== null && !lb.error && score > 0 && score > (lb.mine?.score || 0);
    }

    async function loadLeaderboard() {
      try {
        const api = await leaderboardApi();
        const [top, mine, uid] = await Promise.all([api.topScores(GAME_ID, 10), api.myScore(GAME_ID), api.myUid()]);
        Object.assign(lb, { top, mine, uid, error: false });
      } catch (err) {
        console.error(err);
        lb.error = true;
      }
      renderLeaders();
      renderMessage();
    }

    function renderLeaders() {
      noteEl.textContent = lb.error ? "Offline" : lb.top === null ? "Loading…" : lb.mine ? `Your best: ${fmt(lb.mine.score)}` : "";
      listEl.replaceChildren();
      if (lb.top && !lb.top.length) {
        const li = document.createElement("li");
        li.className = "empty";
        li.textContent = "No scores yet. Be the first!";
        listEl.append(li);
      }
      (lb.top || []).forEach((entry, i) => {
        const li = document.createElement("li");
        if (entry.uid === lb.uid) li.className = "me";
        for (const [cls, text] of [["rank", `${i + 1}.`], ["name", entry.name], ["pts", fmt(entry.score)]]) {
          const span = document.createElement("span");
          span.className = cls;
          span.textContent = text;
          li.append(span);
        }
        listEl.append(li);
      });
      renderSaveForm();
    }

    function renderSaveForm() {
      const show = canSave();
      saveForm.hidden = !show;
      if (!show) return;
      saveBtn.textContent = `Save ${fmt(score)}`;
      if (!nameInput.value) {
        let remembered = "";
        try { remembered = localStorage.getItem(NAME_KEY) || ""; } catch {}
        nameInput.value = lb.mine?.name || remembered;
      }
    }

    saveForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (lb.saving || !canSave()) return;
      const api = await leaderboardApi();
      const name = api.cleanName(nameInput.value);
      if (!api.NAME_RE.test(name)) {
        saveMsg.textContent = "Pick a name of up to 12 letters, numbers or spaces.";
        nameInput.focus();
        return;
      }
      lb.saving = true;
      saveBtn.disabled = true;
      saveMsg.textContent = "Saving…";
      try {
        await api.saveScore(GAME_ID, name, score);
        try { localStorage.setItem(NAME_KEY, name); } catch {}
        nameInput.value = name;
        nameInput.blur();
        saveMsg.textContent = `Saved ${fmt(score)} as ${name}.`;
        await loadLeaderboard();
      } catch (err) {
        console.error(err);
        saveMsg.textContent = /permission/i.test(err?.message || err?.code || "")
          ? "Couldn't save just yet. Try again in a few seconds."
          : "Couldn't save. Check your connection and try again.";
      } finally {
        lb.saving = false;
        saveBtn.disabled = false;
      }
    });

    // ---------- start ----------
    const saved = load();
    if (saved && Array.isArray(saved.grid) && saved.grid.length === SIZE) {
      setGridValues(saved.grid);
      score = saved.score || 0;
      best = Math.max(saved.best || 0, score);
      won = !!saved.won;
      keepPlaying = !!saved.keepPlaying;
      over = !canMove();
      if (!liveTiles().length) { spawn(); spawn(); }
      render();
    } else {
      newGame();
    }

    // Hooks for automated tests; harmless for players.
    setTimeout(loadLeaderboard, 300);

    window.__2048 = {
      leaderboard: () => ({ ...lb }),
      reloadLeaderboard: loadLeaderboard,
      move,
      finish: finishMove,
      setGrid(values, s = 0) { finishMove(); setGridValues(values); score = s; over = !canMove(); won = values.flat().some((v) => v >= 2048); keepPlaying = false; history = null; render(); },
      grid: gridValues,
      state: () => ({ score, best, won, keepPlaying, over, canUndo: !!history }),
      setSpawn(on) { spawnEnabled = on; },
    };
  </script>
</body>
</html>
