<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Project title</title>
  <meta name="description" content="One sentence about the project.">
  <style>
    :root {
      --bg: #f7f6f3;
      --surface: #ffffff;
      --text: #1d1d1f;
      --muted: #6b6b70;
      --border: #e3e1dc;
      --accent: #c2571a;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161618;
        --surface: #1f1f22;
        --text: #ececef;
        --muted: #9a9aa2;
        --border: #2e2e33;
        --accent: #f08a4b;
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: grid;
      place-items: center;
      padding: 16px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Project title</h1>
  </main>
  <script>
  </script>
</body>
</html>
