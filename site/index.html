<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f6f3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161618" media="(prefers-color-scheme: dark)">
  <title>reclaude</title>
  <meta name="description" content="Small games and tools for your phone, alone or with friends.">
  <style>
    :root {
      --bg: #f7f6f3;
      --text: #1d1d1f;
      --muted: #5e5e63;
      --panel: #ffffff;
      --line: #e3ddd2;
      --soft: #ece7df;
      --accent: #b04d14; --on-accent: #fff;
      --red: #e03e3e; --blue: #2f6fd6; --green: #24a05a; --gold: #e0a019; --purple: #8a4bd4;
      --ink: #1d1d1f; --paper: #ffffff; --wood: #6b4a2b;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161618;
        --text: #ececef;
        --muted: #9a9aa2;
        --panel: #1f1f22;
        --line: #303036;
        --soft: #2a2a2e;
        --accent: #f08a4b; --on-accent: #1d1d1f;
        --red: #ff5f5f; --blue: #5f97ff; --green: #3fd37f; --gold: #f7bd3f; --purple: #b88cff;
        --ink: #ececef; --paper: #2c2c31; --wood: #e0b27a;
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }
    main {
      width: 100%;
      max-width: 760px;
      padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    }
    header { padding: 0 0 20px; }
    h1 { font-size: 2rem; line-height: 1.15; margin: 0; letter-spacing: -0.02em; }
    header p { margin: 6px 4px 0; color: var(--muted); }
    /* The title row, as on every page (shared/base.css): back home (‹), the title, your profile at the right. */
    .title-bar { display: flex; align-items: center; gap: 6px; }
    .title-bar h1 { flex: 1; min-width: 0; }
    .home-link {
      flex: none; display: inline-grid; place-items: center; width: 44px; height: 44px; margin-left: -10px;
      color: var(--text); font-size: 2.1rem; line-height: 1; text-decoration: none; border-radius: 12px;
    }
    .me-link {
      flex: none; display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 50%;
      background: var(--soft); font-size: 1.35rem; line-height: 1; text-decoration: none;
    }
    :is(.home-link, .me-link):active { opacity: 0.6; }
    :is(.home-link, .me-link):focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    /* One row per section of the site. */
    .sections { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
    .section {
      display: flex; gap: 14px; align-items: center; padding: 14px; border-radius: 18px;
      background: var(--panel); border: 1px solid var(--line); color: inherit; text-decoration: none;
      transition: transform 120ms ease, box-shadow 120ms ease;
    }
    .section:hover { box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08); }
    .section:active { transform: scale(0.98); }
    .section:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .icon { flex: none; width: 64px; height: 64px; border-radius: 16px; background: var(--soft); display: grid; place-items: center; font-size: 2.2rem; line-height: 1; }
    .info { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
    .info h2 { margin: 0; font-size: 1.1rem; }
    .info p { margin: 0; color: var(--muted); font-size: 0.92rem; line-height: 1.35; }
    .chevron { margin-left: auto; color: var(--muted); font-size: 1.6rem; line-height: 1; }
    @media (prefers-reduced-motion: reduce) { .section { transition: none; } }
    .install { margin: 20px 0 0; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
    .install button {
      font: inherit; font-weight: 650; border: 0; border-radius: 12px; padding: 12px 18px; min-height: 44px; cursor: pointer;
      background: var(--soft); color: var(--text);
    }
    .install p { margin: 0; font-size: 0.9rem; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="title-bar">
        <h1>reclaude</h1>
        <a class="me-link" href="apps/profile/" aria-label="Your profile">👤</a>
      </div>
      <p>Small things to play and do on your phone.</p>
    </header>

    <ul class="sections">
      <li><a class="section" href="games/">
        <span class="icon" aria-hidden="true">🎲</span>
        <div class="info"><h2>Games</h2><p>Play alone, pass the phone around, or play friends online.</p></div>
        <span class="chevron" aria-hidden="true">›</span>
      </a></li>
      <li id="plaza-row" hidden><a class="section" href="apps/plaza/">
        <span class="icon" aria-hidden="true">⛲</span>
        <div class="info"><h2>Plaza</h2><p>Walk around a little square and wave at whoever's there.</p></div>
        <span class="chevron" aria-hidden="true">›</span>
      </a></li>
    </ul>
    <div class="install" id="install" hidden>
      <button id="install-btn">📲 Install as an app</button>
      <p id="install-help"></p>
    </div>
  </main>
  <script>
    // The account-only apps, on devices signed in to an account (as shared/core.js last saw it: shared/me.js,
    // "core-account"). Only what's shown: the Plaza's server checks for itself.
    try { if (localStorage.getItem("core-account")) document.getElementById("plaza-row").hidden = false; } catch {}
  </script>
  <script>
    // "Install as an app": Android and desktop Chrome offer it themselves (beforeinstallprompt); on an iPhone or iPad
    // it's Share, then Add to Home Screen. Hidden once it runs as an app.
    (() => {
      const box = document.getElementById("install"), btn = document.getElementById("install-btn"), help = document.getElementById("install-help");
      const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
      if (standalone) return;
      let offer = null;
      addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); offer = e; box.hidden = false; help.textContent = "Opens full screen from your home screen; games you've played work offline."; });
      addEventListener("appinstalled", () => { box.hidden = true; });
      const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      if (ios) { box.hidden = false; help.textContent = ""; }
      btn.addEventListener("click", async () => {
        if (offer) { offer.prompt(); await offer.userChoice.catch(() => {}); offer = null; box.hidden = true; return; }
        help.textContent = "Tap the Share button, then “Add to Home Screen”.";
      });
    })();
  </script>
</body>
</html>
