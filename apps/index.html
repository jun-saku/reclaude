<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f6f3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161618" media="(prefers-color-scheme: dark)">
  <title>Apps</title>
  <meta name="description" content="Small tools for planning and doing things together, with one profile for all of them.">
  <link rel="stylesheet" href="../shared/base.css">
  <style>
    .apps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
    .app {
      display: flex; align-items: center; gap: 14px; min-height: 44px; padding: 16px; border-radius: 16px;
      background: var(--panel); border: 1px solid var(--line); color: inherit; text-decoration: none;
    }
    .app:active { transform: scale(0.98); }
    .app:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .app .icon { font-size: 2rem; line-height: 1; flex: none; }
    .app h2 { margin-bottom: 2px; }
    .app p { color: var(--muted); font-size: 0.95rem; }
  </style>
</head>
<body>
  <main>
    <h1>Apps</h1>
    <p class="muted" id="hello">Small tools for doing things together.</p>
    <ul class="apps">
      <li><a class="app" href="./profile/">
        <span class="icon" id="profile-icon" aria-hidden="true">👤</span>
        <div><h2>Profile</h2><p id="profile-line">Your name and avatar, the same in every app.</p></div>
      </a></li>
    </ul>
  </main>
  <script type="module">
    import * as core from "../shared/core.js";
    // Greets someone who already has a profile; anyone else just sees the list (it signs no one up).
    try {
      const me = (await core.signedIn()) && (await core.myProfile());
      if (me) {
        document.getElementById("hello").textContent = `Hi, ${me.display_name}!`;
        if (me.avatar) document.getElementById("profile-icon").textContent = me.avatar;
        document.getElementById("profile-line").textContent = "Change your name or avatar.";
      }
    } catch {}
  </script>
</body>
</html>
