<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f6f3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161618" media="(prefers-color-scheme: dark)">
  <title>Pickleball</title>
  <meta name="description" content="Court rotation for your pickleball group: who's playing and who's next.">
  <link rel="stylesheet" href="../../shared/base.css">
  <style>
    a.button { display: flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 18px; border-radius: 12px;
      background: var(--accent); color: var(--on-accent); font-weight: 650; text-decoration: none; }
    a.button.secondary { background: var(--soft); color: var(--text); }
    .head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .head h2 { min-width: 0; overflow-wrap: anywhere; }
    .views { display: flex; flex-direction: column; gap: 12px; }
    .list { display: flex; flex-direction: column; gap: 6px; }
    .item { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 2px 0; }
    .item .who { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .item.wrap .who { white-space: normal; }
    .item .meta { color: var(--muted); font-size: 0.85rem; white-space: nowrap; }
    a.item { color: var(--text); text-decoration: none; }
    a.item::after { content: "›"; color: var(--muted); font-size: 1.4rem; }
    button.item { width: 100%; background: transparent; color: var(--text); padding: 0; text-align: left; font-weight: 500; }
    .icon-btn { padding: 0; width: 44px; background: var(--soft); color: var(--text); }
    .empty { color: var(--muted); font-size: 0.95rem; }
    .form { display: flex; gap: 8px; }
    .form input, .form select, .field select, .field input {
      min-width: 0; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--text);
    }
    .form input, .form select { flex: 1; }
    .form input.emoji { flex: none; width: 56px; text-align: center; }
    .field { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-weight: 650; }
    .check { display: flex; align-items: center; gap: 10px; min-height: 44px; }
    .check input { width: 22px; height: 22px; min-width: 22px; min-height: 22px; margin: 11px; accent-color: var(--accent); }
    .tag { display: inline-block; font-size: 0.8rem; font-weight: 650; padding: 2px 8px; border-radius: 999px; background: var(--soft); white-space: nowrap; }
    .court { display: flex; flex-direction: column; gap: 8px; }
    .vs { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
    .side { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .side span, .side button { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .side button { background: var(--soft); color: var(--text); font-weight: 600; padding: 8px 10px; text-align: left; }
    .side button.secondary { white-space: normal; text-align: center; font-size: 0.9rem; }
    .vs > .muted { font-weight: 700; font-size: 0.85rem; }
    .free { color: var(--muted); }
    .line-no { width: 1.6em; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
    .item.away .who { opacity: 0.6; }
    dialog { width: min(440px, calc(100% - 32px)); border: 1px solid var(--line); border-radius: 16px; padding: 16px;
      background: var(--panel); color: var(--text); }
    dialog::backdrop { background: rgba(0, 0, 0, 0.45); }
    dialog form { display: flex; flex-direction: column; gap: 12px; }
    .qr { display: flex; justify-content: center; }
    .qr svg { width: 220px; height: 220px; border-radius: 10px; border: 1px solid var(--line); }
    .scores { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .scores input { width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line);
      background: var(--bg); color: var(--text); text-align: center; }
    .scores label { display: flex; flex-direction: column; gap: 4px; font-size: 0.9rem; font-weight: 650; min-width: 0; }
  </style>
</head>
<body>
  <main>
    <div class="title-bar">
      <a class="home-link" id="back" href="../../" aria-label="Home">‹</a>
      <h1>Pickleball</h1>
      <a class="me-link" href="../profile/" aria-label="Your profile">👤</a>
    </div>
    <p class="status" id="status" hidden></p>
    <div id="view" class="views"><p class="hint">Loading…</p></div>
    <p class="error" id="error" role="alert"></p>
    <dialog id="sheet"></dialog>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
