name: Build and deploy

# Every PR and push is built and the database rules are tested, so problems are caught before merging.
# On main, the database rules are published to Firebase first, then the game server (worker/) goes to Cloudflare
# Workers, then the site goes to Cloudflare Pages.
# PRs get a Cloudflare preview link, posted as a PR comment.
# Cloudflare steps are skipped until the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets exist.
on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  # Never cancel a deploy halfway; superseded checks on other branches can go.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build.mjs
      # The game server's sign-in check (worker/src/auth.js), with test-signed tokens. No dependencies.
      - run: node tests/worker-auth.test.mjs
      # Smoke test of every page (tests/smoke.cjs): part of the required build check. Uses the runner's own Chrome.
      - name: Smoke test
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/pw" playwright-core@1.56.1
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" CHROMIUM_PATH="$(command -v google-chrome)" node tests/smoke.cjs

  # Design check of every screen (tests/ui-audit.cjs): tap targets, text size and contrast, fit at 320 and 390 px, labels
  # and JavaScript errors, in light and dark mode. Not a required check (it takes a few minutes); a red result is a bug.
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build.mjs
      - name: UI audit
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/pw" playwright-core@1.56.1
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" CHROMIUM_PATH="$(command -v google-chrome)" node tests/ui-audit.cjs

  # Checks firebase/database.rules.json against the Firebase emulator (tests/rules.test.mjs).
  rules:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('tests/package-lock.json') }}
      - run: npm ci
      - run: npm run rules

  # End-to-end tests on PRs: only the games a PR changes (tests/pick-e2e.mjs), or all of them when shared code, the
  # rules or the test setup change. Real Firebase SDK + emulator, headless Chrome. Not a required check, so it never
  # holds up a merge; a red result is still worth a look.
  e2e:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pick tests
        id: pick
        run: node tests/pick-e2e.mjs "origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
      - if: steps.pick.outputs.tests != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - if: steps.pick.outputs.tests != ''
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - if: steps.pick.outputs.tests != ''
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('tests/package-lock.json') }}
      - if: steps.pick.outputs.tests != ''
        name: Run ${{ steps.pick.outputs.tests }}
        run: |
          node scripts/build.mjs
          npm install --no-save --prefix "$RUNNER_TEMP/pw" playwright-core@1.56.1
          (cd worker && npm ci)
          cd tests && npm ci
          E2E="${{ steps.pick.outputs.tests }}" NODE_PATH="$RUNNER_TEMP/pw/node_modules" CHROMIUM_PATH="$(command -v google-chrome)" npm run e2e

  # Publishes firebase/database.rules.json to the live database, on main only, after the rules tests pass.
  # Signs in to Google with GitHub's short-lived ID token (Workload Identity Federation): no stored key.
  # Google only accepts tokens from jun-saku/reclaude on refs/heads/main (set up once in Cloud Shell).
  publish_rules:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build, rules]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/720774301235/locations/global/workloadIdentityPools/github/providers/reclaude
          service_account: rules-deployer@reclaude-67a01.iam.gserviceaccount.com
      - name: Publish database rules
        run: npx --yes firebase-tools@13.35.1 deploy --only database --project reclaude-67a01 --non-interactive

  # The game server (worker/, a Cloudflare Worker with one Durable Object per room) at play.reclaude.junsaku.dev, from
  # main only, after the rules and before the site, so a new page never meets an older server. PR previews use the
  # live server. Skipped until the Cloudflare secrets exist; the API token needs "Workers Scripts: Edit". The address
  # (custom domain) is set once in the Cloudflare dashboard. If this fails, the site still deploys.
  worker:
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.build.result == 'success' }}
    needs: [build, publish_rules]
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: worker
    steps:
      - id: secrets
        name: Check Cloudflare secrets
        working-directory: .
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Cloudflare secrets not set yet; skipping the game server deploy."
          fi
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - if: steps.secrets.outputs.ready == 'true'
        run: npm ci
      - if: steps.secrets.outputs.ready == 'true'
        name: Deploy the game server
        run: npx wrangler deploy

  # Cloudflare Pages: production from main, previews for PRs. Uploads the built site directly
  # (no Cloudflare-GitHub connection needed, and direct uploads don't use Cloudflare's build quota).
  # On main it waits for the rules to publish; PR previews use the live rules.
  cloudflare:
    if: ${{ !cancelled() && needs.build.result == 'success' && (github.event_name == 'pull_request' || (github.ref == 'refs/heads/main' && needs.publish_rules.result == 'success')) }}
    needs: [build, publish_rules, worker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: reclaude
    steps:
      - id: secrets
        name: Check Cloudflare secrets
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Cloudflare secrets not set yet; skipping the Cloudflare deploy."
          fi
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: steps.secrets.outputs.ready == 'true'
        run: node scripts/build.mjs
      - if: steps.secrets.outputs.ready == 'true'
        name: Create the Pages project (first run only)
        run: npx --yes wrangler@4 pages project create "$PROJECT" --production-branch=main || echo "Project already exists."
      - if: steps.secrets.outputs.ready == 'true'
        id: deploy
        name: Upload to Cloudflare Pages
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          npx --yes wrangler@4 pages deploy _site --project-name="$PROJECT" --branch="$BRANCH" --commit-dirty=true 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.pages\.dev' deploy.log | tail -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to Cloudflare Pages: $url" >> "$GITHUB_STEP_SUMMARY"
      - if: github.event_name == 'pull_request' && steps.deploy.outputs.url != ''
        name: Post the preview link on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.url }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          body="Preview of this PR: $URL (updated for ${GITHUB_SHA::7}). Add a project's folder name to the end, e.g. $URL/2048/"
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --edit-last --body "$body" \
            || gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$body"
