name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, for each file's "updated" date

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build file list
        run: node scripts/build-manifest.mjs

      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html files.json assets _site/
          for d in docs slides pages; do
            if [ -d "$d" ]; then cp -r "$d" _site/; fi
          done
          find _site -name '_*' -prune -exec rm -rf {} +

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
