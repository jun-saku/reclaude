# The game server for real-time online games: one Durable Object per game room. See README.md.
# Deployed from main by .github/workflows/pages.yml (job "worker"); run locally with `npm run dev`.
name = "reclaude-games"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = false
routes = [{ pattern = "play.reclaude.junsaku.dev", custom_domain = true }]

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "GameRoom"

# The free plan runs only SQLite-backed Durable Objects.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]
