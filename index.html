<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>reclaude</title>
  <meta name="description" content="Docs, slides and pages, written and published by Claude.">
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="assets/theme.css">
  <style>
    .wrap { max-width: 960px; margin: 0 auto; padding: 32px 16px 80px; }
    header h1 { margin: 0; font-size: 1.8rem; }
    header p { margin: 4px 0 24px; color: var(--muted); }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
    #search {
      flex: 1 1 220px;
      font: inherit;
      padding: 10px 14px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
    }
    .chip {
      font: inherit;
      font-size: 0.9rem;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
    }
    .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
    .card {
      display: block;
      padding: 16px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--surface);
      color: inherit;
      text-decoration: none;
    }
    .card:hover { border-color: var(--accent); }
    .card .type { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--accent); }
    .card h2 { font-size: 1.1rem; margin: 6px 0 4px; line-height: 1.3; }
    .card p { margin: 0; color: var(--muted); font-size: 0.9rem; }
    .card time { display: block; margin-top: 10px; font-size: 0.8rem; color: var(--muted); }
    .empty { color: var(--muted); padding: 32px 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>reclaude</h1>
      <p>Docs, slides and pages, written and published by Claude.</p>
    </header>
    <div class="controls">
      <input id="search" type="search" placeholder="Search" aria-label="Search files">
      <button class="chip" data-section="" aria-pressed="true">All</button>
      <button class="chip" data-section="docs" aria-pressed="false">Docs</button>
      <button class="chip" data-section="slides" aria-pressed="false">Slides</button>
      <button class="chip" data-section="pages" aria-pressed="false">Pages</button>
    </div>
    <main id="grid" class="grid"></main>
  </div>

  <script>
    const LABELS = { docs: "Doc", slides: "Slides", pages: "Page" };
    const grid = document.getElementById("grid");
    const search = document.getElementById("search");
    let files = [];
    let section = "";

    function esc(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
    }

    function render() {
      const q = search.value.trim().toLowerCase();
      const shown = files.filter((f) =>
        (!section || f.section === section) &&
        (!q || (f.title + " " + f.description + " " + f.path).toLowerCase().includes(q))
      );
      if (!shown.length) {
        grid.innerHTML = '<p class="empty">Nothing here yet.</p>';
        return;
      }
      grid.innerHTML = shown.map((f) => `
        <a class="card" href="${esc(f.path)}">
          <span class="type">${LABELS[f.section] || f.section}</span>
          <h2>${esc(f.title)}</h2>
          ${f.description ? `<p>${esc(f.description)}</p>` : ""}
          <time datetime="${esc(f.updated)}">Updated ${new Date(f.updated).toLocaleDateString()}</time>
        </a>`).join("");
    }

    document.querySelectorAll(".chip").forEach((chip) => {
      chip.addEventListener("click", () => {
        section = chip.dataset.section;
        document.querySelectorAll(".chip").forEach((c) => c.setAttribute("aria-pressed", String(c === chip)));
        render();
      });
    });
    search.addEventListener("input", render);

    fetch("files.json", { cache: "no-store" })
      .then((r) => r.json())
      .then((data) => { files = data.files || []; render(); })
      .catch(() => { grid.innerHTML = '<p class="empty">Could not load files.json. Run node scripts/build-manifest.mjs.</p>'; });
  </script>
</body>
</html>
